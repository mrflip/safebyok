# The services the e2e tests run against, for a contributor's machine; CI starts the same images as
# service containers (.github/workflows/ci.yml). One service to a backend, none of them needed by
# `pnpm justify`: a test that needs a service is skipped where its connection string is unset.
#
#   docker compose -f e2e/compose.yaml up -d --wait     # from the repository root: or `pnpm --filter safebyok-e2e db:up`
#   pnpm --filter safebyok-e2e test:postgres
#   docker compose -f e2e/compose.yaml down              # or `pnpm --filter safebyok-e2e db:down`
#
# Each service listens on 127.0.0.1 only and has no password to keep: it holds nothing but
# ciphertext made by the tests, and is thrown away with its container.
name: safebyok-e2e

services:
  # Postgres 17, for the VaultDB battery and the races of `safebyok-postgres`: SAFEBYOK_PG_URL for
  # tests/postgres/ is postgres://postgres@127.0.0.1:54320/postgres. The role is a superuser, as
  # the tests make a database of their own for each file.
  postgres:
    image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:54320:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "--username", "postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Slots, one service each as the tests for them are written (none is built yet):
  #   convex     Convex's local backend, for safebyok-convex against a real deployment.
  #   mysql, ... any later storage adapter's database.
  # A browser is a different animal and gets its own e2e job when the Playwright specs are built,
  # not a service here.
