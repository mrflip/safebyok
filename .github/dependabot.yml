# Weekly update pull requests, grouped so they arrive as a few PRs rather than dozens. Security
# updates come as they are published, whatever this schedule says.
version: 2
updates:
  - package-ecosystem: npm
    # The root covers the whole pnpm workspace: Dependabot reads pnpm-workspace.yaml there and
    # checks every package its globs match (packages/*, demos/*, e2e) against the one lockfile. Listing
    # those directories too would run overlapping updates of one lockfile.
    directory: /
    schedule:
      interval: weekly
    # Matches pnpm's minimumReleaseAge (pnpm-workspace.yaml): propose nothing younger than seven
    # days, which the install would refuse anyway.
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # typescript-eslint caps the TypeScript it supports: TypeScript moves when it does.
      - dependency-name: typescript
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      # @types/node follows the Node major in .tool-versions.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      actions:
        patterns: ['*']

  # The Postgres image the e2e tests run on (e2e/compose.yaml), pinned by digest. The same digest
  # is written in .github/workflows/ci.yml's `postgres` job, which Dependabot does not read: move
  # the two together.
  - package-ecosystem: docker-compose
    directory: /e2e
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
