name: CodeQL

# GitHub's static analysis for security problems, over the package's code and over these
# workflows themselves (the release workflow holds the right to publish). Findings appear on the
# Security tab, and on a pull request that introduces one. This file replaces CodeQL's "default
# setup": leave that switched off in the repository's settings, or the two will collide.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1'

# As in ci.yml: a draft pull request is held until it carries the label `ci` or is marked ready,
# but for Mergify's batches; another label runs nothing and cancels nothing; a new push to a pull
# request cancels its run in progress; and pushes to main run one at a time, a waiting one
# replaced by a newer push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.action == 'labeled' && github.event.label.name != 'ci' && github.run_id || github.head_ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    if: >-
      ${{ github.event_name != 'pull_request'
      || (github.event.action != 'labeled' || github.event.label.name == 'ci')
      && (!github.event.pull_request.draft
      || contains(github.event.pull_request.labels.*.name, 'ci')
      || startsWith(github.head_ref, 'mergify/merge-queue/')) }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
