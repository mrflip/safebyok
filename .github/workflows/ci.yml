name: CI

# A draft pull request is held, its jobs skipped, so a worker can push a draft as often as it
# likes without filling the queue, until it carries the label `ci` or is taken out of draft
# (PROCESS.md, Pull requests). The label is read at each push, never listened for: adding it
# starts nothing, so a worker adds it before the push it expects green, and it stays. A skipped
# job's check reads as passed, and the ruleset reads a commit's latest run of each check, so a run
# that skips beside a real one on the same commit would mask a red or running result: with a
# `labeled` trigger, every other label (the Coach's `queue`, Dependabot's) made one. Mergify's
# batch pull requests (.mergify.yml) are drafts on `mergify/merge-queue/` branches, and its merge
# conditions wait on their checks, so they always run. A held draft cannot merge, and a skipped
# matrix job reports no `node-compat (22)` at all, which the ruleset shows as expected.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# A new push to a pull request cancels that pull request's run still in progress: only the latest
# commit's result matters there. Pushes to main share one group and run one at a time, so a run of
# merges never holds more runners than one run's jobs, and pull requests keep the rest. A run in
# progress on main always finishes; one still waiting is replaced by a newer push, so a commit
# merged while another waited has no run of its own, and the commit after it, which holds it,
# answers for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Within a job every check runs whatever an earlier one found, so one failure never hides another,
# and the job fails if any did. The main ruleset requires every job here, both `node-compat` runs
# among them, and CodeQL's result.
# Each step is a root script: the root's own check, then every workspace package's (`pnpm -r`),
# so a package added under packages/, demos/ or e2e/ is covered with no edit here. A new job
# stands beside these, with its own checkout and setup.
jobs:
  # Lint first, as the likelier of the two to fail for a reason worth reading, then typecheck, then
  # a pull request's changeset, and last the workflows themselves. A merge commit in a pull
  # request's branch is not refused here: a stack's pull requests land in order, each as one merge
  # commit with its SHAs unchanged (.mergify.yml), which keeps main's history semi-linear (PROCESS.md).
  lint-typecheck:
    if: >-
      ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft
      || contains(github.event.pull_request.labels.*.name, 'ci')
      || startsWith(github.head_ref, 'mergify/merge-queue/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - id: install
        run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm typecheck
      # A pull request that changes a public package carries a changeset saying what its release
      # would say; one that needs no release carries an empty one (PROCESS.md, Releases). The Version
      # PR is where changesets are used up, so asking it for one is wrong by construction: it is
      # skipped, when the release GitHub App (safebyok[bot]) opened it from its branch; a branch
      # named for it, opened by anyone else, is asked like any other. Dependabot cannot write a
      # changeset, so its pull request is asked for one only when every commit on it is Dependabot's
      # and it moves a public package's runtime dependencies (scripts/runtime-deps.ts), which ship
      # to hosts: dependabot-changeset.yml writes that changeset, and pushes it, which runs this
      # again. A devDependency or lockfile bump passes. A Dependabot branch with anyone else's
      # commit on it, the changeset's own included, is asked like any other.
      - name: Require a changeset
        if: >-
          ${{ !cancelled() && steps.install.outcome == 'success' && github.event_name == 'pull_request'
          && !(startsWith(github.head_ref, 'changeset-release/') && github.event.pull_request.user.login == 'safebyok[bot]') }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [ "$PR_AUTHOR" = 'dependabot[bot]' ] && node scripts/dependabot.ts commits "$BASE_SHA" "$HEAD_SHA" > /dev/null; then
            fork=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
            moved=$(node scripts/runtime-deps.ts "$fork" "$HEAD_SHA")
            if [ -z "$moved" ]; then
              echo "Dependabot moved no public package's runtime dependencies: no changeset needed."
              exit 0
            fi
            echo "Dependabot moved runtime dependencies that ship to hosts, so a changeset is needed:"
            echo "$moved"
          fi
          pnpm changeset status --since="$BASE_SHA"

      # The Postgres image is pinned by digest here and in e2e/compose.yaml, and Dependabot moves
      # only the compose file's: a difference means the CI job tests another Postgres than a
      # contributor runs. Move both together.
      - name: Check the Postgres image digest matches e2e/compose.yaml
        if: ${{ !cancelled() }}
        run: |
          image='postgres:[0-9][0-9.]*@sha256:[0-9a-f]{64}'
          in_ci=$(grep --only-matching --extended-regexp "$image" .github/workflows/ci.yml | sort --unique)
          in_compose=$(grep --only-matching --extended-regexp "$image" e2e/compose.yaml | sort --unique)
          if [ -z "$in_ci" ] || [ "$in_ci" != "$in_compose" ]; then
            echo "::error::The Postgres image differs between .github/workflows/ci.yml and e2e/compose.yaml. Move both to the same digest."
            printf 'ci.yml:       %s\ncompose.yaml: %s\n' "$in_ci" "$in_compose"
            exit 1
          fi

      # actionlint, the release recorded in scripts/actionlint.sh by its version and hash, as
      # `pnpm justify` runs it: the tarball is checked against the sha256 in its release's checksums
      # file before anything in it runs. The runner's shellcheck lints each `run:` script.
      - name: Lint the workflows
        if: ${{ !cancelled() }}
        run: scripts/actionlint.sh -color

  # The unit tests with coverage, which build every package first: under CI a build fails on any
  # warning, and checks each package as a consumer would see it (publint, arethetypeswrong: each
  # tsdown.config.ts), and a failed build fails this step before any test runs.
  test-build:
    if: >-
      ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft
      || contains(github.event.pull_request.labels.*.name, 'ci')
      || startsWith(github.head_ref, 'mergify/merge-queue/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - id: install
        run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage

  # The unit tests on the Node majors a consumer may run, beside the one we develop on. Node 22 is
  # the platform floor (`engines`), and a failure there is a gate; the newest Node reports, and a
  # failure there is news.
  node-compat:
    if: >-
      ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft
      || contains(github.event.pull_request.labels.*.name, 'ci')
      || startsWith(github.head_ref, 'mergify/merge-queue/') }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.node != 22 }}
    strategy:
      fail-fast: false
      matrix:
        node: [22, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # The bankDB battery, its races and the box limit's, run over a real
  # Postgres: PGlite, which every other Postgres test uses, runs one statement at a time and cannot
  # race (the old design's VAULTDB.md, Proving the races, at 100256bb7). The role is a superuser with no
  # password, the container reachable on this runner alone, and each test file makes a database
  # of its own. Which suites run here is the one list in e2e/tests/postgres/test-helpers.ts.
  postgres:
    if: >-
      ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft
      || contains(github.event.pull_request.labels.*.name, 'ci')
      || startsWith(github.head_ref, 'mergify/merge-queue/') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      SAFEBYOK_PG_URL: postgres://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter safebyok-e2e test:postgres
