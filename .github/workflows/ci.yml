name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a pull request cancels that pull request's run still in progress: only the latest
# commit's result matters there. Pushes to main each get a group of their own, by run id, so every
# commit to main keeps its result.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

# Within a job every check runs whatever an earlier one found, so one failure never hides another,
# and the job fails if any did. `lint-typecheck` and `test-build` are the two the main ruleset
# requires, and `node-compat (22)` is the third it should (the platform floor: engines `>=22`).
# Each step is a root script: the root's own check, then every workspace package's (`pnpm -r`),
# so a package added under packages/, demos/ or e2e/ is covered with no edit here. A new job
# stands beside these, with its own checkout and setup.
jobs:
  # Lint first, as the likelier of the two to fail for a reason worth reading, then typecheck, then
  # keep a pull request's history semi-linear (PROCESS.md): its branch may hold no merge commit;
  # then a pull request's changeset, and last the workflows themselves.
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - id: install
        run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm typecheck
      - name: Reject merge commits in the branch
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          merges=$(git rev-list --merges "$BASE_SHA..$HEAD_SHA")
          if [ -n "$merges" ]; then
            echo "::error::Branch contains merge commits. Rebase instead: git fetch origin && git rebase origin/main"
            git log --oneline --merges "$BASE_SHA..$HEAD_SHA"
            exit 1
          fi
      # A pull request that changes a public package carries a changeset saying what its release
      # would say; one that needs no release carries an empty one (PROCESS.md, Releases). The Version
      # PR is where changesets are used up, so asking it for one is wrong by construction: it is
      # skipped, when the release GitHub App (safebyok[bot]) opened it from its branch; a branch
      # named for it, opened by anyone else, is asked like any other. Dependabot cannot write a
      # changeset, so its pull request is asked for one only when every commit on it is Dependabot's
      # and it moves a public package's runtime dependencies (scripts/runtime-deps.ts), which ship
      # to hosts: dependabot-changeset.yml writes that changeset, and pushes it, which runs this
      # again. A devDependency or lockfile bump passes. A Dependabot branch with anyone else's
      # commit on it, the changeset's own included, is asked like any other.
      - name: Require a changeset
        if: >-
          ${{ !cancelled() && steps.install.outcome == 'success' && github.event_name == 'pull_request'
          && !(startsWith(github.head_ref, 'changeset-release/') && github.event.pull_request.user.login == 'safebyok[bot]') }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [ "$PR_AUTHOR" = 'dependabot[bot]' ] && node scripts/dependabot.ts commits "$BASE_SHA" "$HEAD_SHA" > /dev/null; then
            fork=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
            moved=$(node scripts/runtime-deps.ts "$fork" "$HEAD_SHA")
            if [ -z "$moved" ]; then
              echo "Dependabot moved no public package's runtime dependencies: no changeset needed."
              exit 0
            fi
            echo "Dependabot moved runtime dependencies that ship to hosts, so a changeset is needed:"
            echo "$moved"
          fi
          pnpm changeset status --since="$BASE_SHA"

      # actionlint, the release recorded here by its hash: the tarball is fetched and checked
      # against the sha256 in its release's checksums file (actionlint_<version>_checksums.txt)
      # before anything in it runs. The runner's shellcheck lints each `run:` script.
      - name: Lint the workflows
        if: ${{ !cancelled() }}
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          tarball="$RUNNER_TEMP/actionlint.tgz"
          curl --fail --silent --show-error --location --output "$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $tarball" | sha256sum --check --strict
          tar --extract --gzip --file "$tarball" --directory "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  # The unit tests with coverage, which build every package first: under CI a build fails on any
  # warning, and checks each package as a consumer would see it (publint, arethetypeswrong: each
  # tsdown.config.ts), and a failed build fails this step before any test runs. Last, the size
  # budget: what a bundler ships for each way of importing the packages measured, against the
  # limits in .size-limit.json, read from the build the step before made.
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - id: install
        run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm size:check

  # The unit tests on the Node majors a consumer may run, beside the one we develop on. Node 22 is
  # the platform floor (`engines`), and a failure there is a gate; the newest Node reports, and a
  # failure there is news. The floor's check, `node-compat (22)`, is the one for the main ruleset.
  node-compat:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.node != 22 }}
    strategy:
      fail-fast: false
      matrix:
        node: [22, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # The VaultDB battery, its races, the lockbox limit's and the hard-cap trigger's, run over a real
  # Postgres: PGlite, which every other Postgres test uses, runs one statement at a time and cannot
  # race (packages/safebyok/VAULTDB.md, Proving the races). The role is a superuser with no
  # password, the container reachable on this runner alone, and each test file makes a database
  # of its own. Which suites run here is the one list in e2e/tests/postgres/test-helpers.ts.
  # Not required by the ruleset until it has run a while.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      SAFEBYOK_PG_URL: postgres://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter safebyok-e2e test:postgres
