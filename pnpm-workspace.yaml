# The root is a private workspace that is never published. packages/ holds the published packages
# (safebyok, the core, and its companions); demos/ holds private playground apps that exercise them;
# e2e/ holds the private tests that pair an adapter with a framework's client.
packages:
  - packages/*
  - demos/*
  - e2e

# `pnpm -r` runs one package at a time, in dependency order. A package that depends on another
# builds it first (its `build:deps`), and tsdown starts by emptying `dist/`: two such packages run
# side by side would each wipe the core's `dist/` while the other reads it. The root's own scripts
# know better (package.json): `build` goes in dependency order with every `build:deps` stood down
# (SAFEBYOK_SKIP_BUILD_DEPS), so each package builds once; lint and typecheck read sources, never
# a `dist/`, and run side by side; `test` builds once first, then runs the packages' tests up to
# four at a time, as dependency order allows: the core, then convex and react together, then the
# demo.
workspaceConcurrency: 1

allowBuilds:
  esbuild: false
  unrs-resolver: true

# Supply chain: pnpm installs no version of anything, transitive dependencies included, until it has
# been public for seven days (minutes), and refuses rather than falling back to a younger version
# (strict). A version we must take sooner is an exception: PROCESS.md, *Dependencies*, says how it
# is made, and each one is recorded in notes/security.md.
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true

# A hot release, exempt by exact version (PROCESS.md, *Dependencies*): convex-helpers 0.1.129
# (published 2026-10-21T23:13Z) resolves its entry points to .d.ts, where 0.1.128 resolved them to
# .ts sources that erasableSyntaxOnly refuses (0.1.129 still ships a src/ of .ts no import reaches). The Coach approved taking it a day early; it passes seven days at
# 2026-10-28 23:13 UTC. After that, delete this entry and return the devDependency pins to ranges.
minimumReleaseAgeExclude:
  - convex-helpers@0.1.129
